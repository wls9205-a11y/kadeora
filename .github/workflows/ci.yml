# ⛔ AD-0(2026-09-07) — 이 파이프라인은 run #1(2026-03-14)부터 3,238 런 내내
#    «단 한 번도 초록인 적이 없었다» (success 0건, GitHub API 실측).
#    quality 잡이 언제나 먼저 실패해서 needs 로 매달린 test·e2e·build 3잡은
#    아예 «실행된 적조차 없다». 그래서 그 3잡 안에 있던 결함들도 드러난 적이 없다:
#      · build 잡이 SUPABASE_SERVICE_ROLE_KEY 를 안 넘긴다 → secrets 를 다 등록해도 실패
#      · e2e 잡이 chromium 만 설치하는데 mobile 프로젝트는 iPhone(=webkit) 이다
#      · webServer 기본 타임아웃 60초 < turbopack 콜드 스타트
#    배포가 Vercel 직결이라 이 빨강이 아무 것도 막지 않은 채 6개월을 지났다.
#
# ⚠️ 「게이트는 초록으로 태어난다」 — 아래 어떤 잡도 «조용히 건너뛰지 않는다».
#    Supabase 3종 키는 env-validate 가 «존재 여부만» 본다(src/lib/env-validate.ts).
#    그래서 secrets 가 없어도 플레이스홀더로 build 와 e2e 가 진짜로 돈다 —
#    실제로 컴파일하고 실제로 브라우저를 띄운다(2026-09-07 로컬 실측:
#    build exit 0 · e2e 32/32 passed, .env.local 을 치운 상태에서).
#    secrets 를 등록하면 그 값이 자동으로 우선한다. 워크플로 수정은 필요 없다.
name: CI/CD Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # secrets 가 비어 있으면(미등록) 플레이스홀더로 떨어진다. DB 호출은 각 페이지의
  # try-catch fallback 으로 흡수된다 — 이게 로컬 build 게이트가 원래 돌던 방식이다.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
  NEXT_PUBLIC_SITE_URL: https://kadeora.vercel.app

jobs:
  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      # LB-1 — Anthropic 호출은 관문 하나로만 나간다. 사람의 규율이 아니라 CI 가 지킨다.
      # ⛔ 이 게이트가 없던 시절 55곳 중 51곳이 원장 밖이었고, 크레딧이 마른 48시간이 조용했다.
      - run: bash scripts/llm-gateway-gate.sh

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      # 유닛 846종은 env 를 하나도 읽지 않는다(2026-09-07 실측 — .env.local 치우고 통과).
      - run: npm run test -- --reporter=verbose

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - name: Report credential mode
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "AD-0: 실제 Supabase secrets 로 E2E 를 돌린다."
          else
            echo "::warning::AD-0: NEXT_PUBLIC_SUPABASE_URL 시크릿이 없어 플레이스홀더로 돈다. E2E 는 건너뛰지 않는다 — 페이지는 fallback 경로로 렌더된다. 실데이터 경로까지 보려면 시크릿을 등록할 것."
          fi
      # ⚠️ mobile 프로젝트가 devices['iPhone 14'] = webkit 이다. chromium 만 깔면
      #    mobile 16종이 전부 「Executable doesn't exist」로 죽는다.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      # ⚠️ SUPABASE_SERVICE_ROLE_KEY 는 generateStaticParams 가 부르는 supabase-admin
      #    경로에서 «존재» 검사에 걸린다. 원래 이 잡엔 아예 없어서, secrets 를 전부
      #    등록했더라도 /apt/stage/[stage]/[region] 수집에서 죽었을 구성이었다.
      #    지금은 워크플로 최상단 env 로 3종이 다 들어온다.
      - run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@main
        with: { path: ./, extra_args: --only-verified }

  type-diff:
    name: DB type sync check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      # ⚠️ 이 잡만은 «진짜 자격증명이 없으면 할 수 있는 일이 없다» — 원격 스키마를
      #    받아와 비교하는 게 전부라 플레이스홀더로 대신할 방법이 없다.
      #    그래서 여기서만 명시적 skip 을 쓴다. 침묵하지 않고 사유를 로그에 남긴다.
      #    ⛔ 임시 조치다. SUPABASE_PROJECT_ID · SUPABASE_ACCESS_TOKEN 을 등록하면
      #       이 가드는 자동으로 열리고, 그때 이 주석과 함께 걷어낼 것.
      - name: Check credentials
        id: cred
        run: |
          if [ -n "${{ secrets.SUPABASE_PROJECT_ID }}" ] && [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::AD-0: SUPABASE_PROJECT_ID/SUPABASE_ACCESS_TOKEN 미등록 — DB 타입 동기화 검사를 건너뛴다. database.ts 가 원격 스키마와 어긋나도 여기서는 못 잡는다."
            echo "ok=false" >> $GITHUB_OUTPUT
          fi
      - if: steps.cred.outputs.ok == 'true'
        run: |
          npx supabase gen types typescript \
            --project-id ${{ secrets.SUPABASE_PROJECT_ID }} \
            --schema public > /tmp/generated.ts
          if ! diff -q src/types/database.ts /tmp/generated.ts > /dev/null 2>&1; then
            echo "::error::database.ts is out of sync. Run: npm run gen-types"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
