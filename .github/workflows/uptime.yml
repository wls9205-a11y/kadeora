# 외부 눈 — kadeora.app 가 살아 있는지 15분마다 밖에서 확인한다 (2026-09-07 신설)
#
# ⛔ 왜 필요한가 — 기존 health-check 는 «Vercel 크론» 이다. 사이트가 죽으면 그 관측도
#    같이 죽는다. 자기를 자기가 보는 관측은 전면 정지를 절대 못 잡는다.
#    8/21 결제 정지로 전체가 내려갔을 때 알아챌 눈이 없었다 — 그 재발을 5분~15분 안에
#    잡는 것이 목적이다.
#
# ⚠️ UptimeRobot 대신 여기 두는 이유는 «가입 0» 이다. GitHub Actions 는 이미 쓰고 있고,
#    워크플로가 실패하면 GitHub 이 저장소 소유자에게 첫 실패 메일을 자동으로 보낸다.
#    (설정: GitHub → Settings → Notifications → Actions → "Send notifications for failed
#     workflows only" 가 기본값이다. 껐다면 켜야 이 파일이 의미를 갖는다.)
#
# ⚠️ 이 워크플로는 «ci.yml 과 별파일» 이다. 섞으면 사이트가 죽었을 때 CI 가 빨개지고,
#    코드가 깨졌을 때와 구분이 안 된다. 빨강의 뜻은 하나여야 한다.
#
# ⚠️ 스케줄은 «보장이 아니다» — GitHub 의 cron 은 부하에 따라 밀리고, 특히 정각 근처가
#    심하다. 그래서 15분 간격에 정각을 피해 7분 오프셋을 뒀다. 「정확히 15분마다」를
#    기대하지 말 것. 이건 «놓치지 않기 위한 그물» 이지 SLA 측정기가 아니다.
#
# ⛔ 여기서 무엇을 «판정하지» 않는다. 응답이 200 이 아니면 빨개질 뿐이다.
#    원인 규명은 Vercel 런타임 로그와 배포 이력이 한다.
name: Uptime

on:
  schedule:
    # 매시 7·22·37·52분 — 정각 혼잡을 피한다.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

# 앞선 회차가 밀려 겹치면 새 회차를 살린다 — 오래된 확인은 값이 없다.
concurrency:
  group: uptime
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: kadeora.app 응답 확인
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # -f: 4xx/5xx 를 실패로 -- 200 이 아니면 여기서 죽는다
      # -sS: 조용하되 에러는 보인다  ·  --max-time 20: 느린 것도 장애다
      # --retry 2: 네트워크 한 번 튄 것으로 사람을 깨우지 않는다. 두 번 더 보고도 안 되면 진짜다.
      - name: HTTPS probe
        run: |
          curl -fsS --max-time 20 --retry 2 --retry-delay 5 \
               -o /dev/null -w 'status=%{http_code} time=%{time_total}s\n' \
               https://kadeora.app
